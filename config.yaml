server:
  tcp_port: 13400
  udp_port: 13400
  doip_version: 0x03
  logical_address: 0x0E80       # DoIP entity address = ECU physical address
  functional_address: 0xE400    # UDS functional address
  vin: "WBA12345678901234"      # optional, defaults to the value of DID 0xF190
  eid: "00:1A:2B:3C:4D:5E"
  gid: "00:1A:2B:3C:4D:5F"
  client_logical_address_min: 0x07E0
  client_logical_address_max: 0x07EF

# Every element (service, session, DID...) can have an `access` block:
#   access:
#     sessions: [0x03]          # allowed active sessions (empty = any)
#     security_levels: [0x01]   # one of these levels must be unlocked (empty = none)
#     nrc: 0x22                 # always answer with this NRC
ecu:
  name: "Engine ECU"
  s3_timeout_ms: 5000

  # A service missing from this list is not supported (NRC 0x11).
  # Use `{}` to enable a service with its default settings.
  services:
    diagnostic_session_control:
      sessions:
        - id: 0x01
          name: default
        - id: 0x02
          name: programming
          p2_ms: 25
          p2_star_ms: 5000
          access:
            sessions: [0x03]    # programming can only be entered from extended
        - id: 0x03
          name: extended

    tester_present: {}

    ecu_reset:
      reset_types:
        - id: 0x01          # hardReset
        - id: 0x03          # softReset
        - id: 0x02          # keyOffOnReset
          access:
            sessions: [0x02, 0x03]
        - id: 0x04          # enableRapidPowerShutDown
          power_down_time: 10

    security_access:
      levels:
        - level: 0x01             # requestSeed = 0x01, sendKey = 0x02
          name: extended
          access:
            sessions: [0x03]
          seed: "11 22 33 44"     # fixed seed; omit for a random seed of seed_length bytes
          algorithm: xor          # xor | add | not | fixed | seed
          secret: "AA BB CC DD"   # key = seed XOR secret = BB 99 FF 99
          max_attempts: 3
          lockout_ms: 10000
        - level: 0x11
          name: programming
          access:
            sessions: [0x02]
          seed_length: 4
          algorithm: add
          secret: "12 34 56 78"

    read_data_by_identifier:
      max_dids_per_request: 8

    write_data_by_identifier:
      access:
        sessions: [0x02, 0x03]

    read_memory_by_address:
      max_read_size: 1024

    write_memory_by_address:
      access:
        sessions: [0x02, 0x03]

  # Data identifiers shared by ReadDataByIdentifier and WriteDataByIdentifier:
  # a successful write changes the value returned by later reads.
  #   ascii / hex      initial value
  #   length           fixed size (writes must match); 0 = size of the value
  #   variable_length  accept writes of any length
  #   volatile         restore the initial value on ECU reset
  #   read             access to read (omitted = always readable)
  #   write            access to write (omitted = not writable)
  dids:
    - id: 0xF190
      name: VIN
      ascii: "WBA12345678901234"
      write:
        sessions: [0x03]
        security_levels: [0x01]

    - id: 0xF18C
      name: ECU serial number
      ascii: "ECU001"

    - id: 0xF189
      name: Software version
      hex: "01 02 03"

    - id: 0xF186
      name: Active diagnostic session
      hex: "01"
      read:
        sessions: [0x01, 0x03]

    - id: 0x0100
      name: Calibration value
      hex: "00 64"
      read:
        sessions: [0x03]
      write:
        sessions: [0x03]

    - id: 0x0101
      name: Workshop name
      ascii: "GODOIP"
      variable_length: true
      volatile: true
      write: {}

    - id: 0x0200
      name: Secret data
      length: 8
      read:
        security_levels: [0x01]

  # ECU memory used by ReadMemoryByAddress / WriteMemoryByAddress.
  # The input file is never modified: writes go to output_file.
  # Paths are relative to this configuration file.
  memory:
    file: firmware/engine_ecu.s19      # .s19/.s28/.s37/.srec, .hex (Intel HEX) or .bin
    # format: srec                     # srec | ihex | bin (default: detect)
    # base_address: 0x0                # load address of .bin files
    output_file: firmware/engine_ecu.out.s19
    # output_format: ihex              # default: same as the input file
    resume_from_output: false          # true: start from output_file if it exists
    fill: 0xFF                         # value of bytes missing from the file
    # Without regions, every segment of the file is readable and writable.
    regions:
      - name: code
        start: 0x010000
        size: 0x10000
        write:
          sessions: [0x02]
          security_levels: [0x11]
      - name: calibration
        start: 0x020000
        size: 0x1000
        read:
          sessions: [0x01, 0x03]
        write:
          sessions: [0x03]
          security_levels: [0x01]
